[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cng-compliance-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "structlog>=25.4,<26.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "pillow>=10.0,<12.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<3.0",
  "prometheus-client>=0.20,<1.0",
  "opentelemetry-api>=1.20,<2.0",
  "opentelemetry-sdk>=1.20,<2.0",
  "pyjwt[crypto]>=2.8.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
